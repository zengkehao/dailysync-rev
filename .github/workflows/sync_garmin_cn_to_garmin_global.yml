name: Sync Garmin CN to Global

on:
  workflow_dispatch:

  schedule:
    # UTC 时间
    # 北京时间约 08:17 和 20:17
    - cron: "17 0,12 * * *"

concurrency:
  group: garmin-cn-to-global
  cancel-in-progress: true

permissions:
  contents: read

env:
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}

  GARMIN_CN_OAUTH1: ${{ secrets.GARMIN_CN_OAUTH1 }}
  GARMIN_CN_OAUTH2: ${{ secrets.GARMIN_CN_OAUTH2 }}

  GARMIN_GLOBAL_OAUTH1: ${{ secrets.GARMIN_GLOBAL_OAUTH1 }}
  GARMIN_GLOBAL_OAUTH2: ${{ secrets.GARMIN_GLOBAL_OAUTH2 }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check Garmin sessions
        run: |
          test -n "$GARMIN_CN_OAUTH1" || exit 1
          test -n "$GARMIN_CN_OAUTH2" || exit 1
          test -n "$GARMIN_GLOBAL_OAUTH1" || exit 1
          test -n "$GARMIN_GLOBAL_OAUTH2" || exit 1

      - name: Sync Garmin CN to Global
        run: yarn sync_cn
